
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: api-rag-pgvector

    environment:
      POSTGRES_DB: bd_gymassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_gymassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api-rag-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5051:80"

    depends_on:
      pgvector:
        condition: service_healthy

    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: api-rag-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: coti
      MONGO_INITDB_ROOT_PASSWORD: coti
      MONGO_INITDB_DATABASE: AgentesIA

    ports:
      - "27018:27017"

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "coti", "--password", "coti", "--authenticationDatabase", "admin", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: api-rag-mongo-express

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: coti
      ME_CONFIG_MONGODB_ADMINPASSWORD: coti
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

    ports:
      - "8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

volumes:
  pgvector_data:
  mongodb_data:
  mongodb_config:
